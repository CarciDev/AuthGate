services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authgate
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authgate"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
    ports: ["6379:6379"]
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --smp=1, --memory=1G, --overprovisioned, --node-id=0,
      "--kafka-addr=0.0.0.0:9092", "--advertise-kafka-addr=redpanda:9092"]
    ports: ["9092:9092"]
  authgate:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/authgate
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP: redpanda:9092
      MODEL_PATH: /checkpoints/model.txt
      SEED_DEMO: "1"
    volumes: ["./checkpoints:/checkpoints:ro"]
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      redpanda: {condition: service_started}
